plugins {
    id 'com.android.library' version '8.3.2'
}

def ksPwd = ""
def keyPwd = ""
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
    ksPwd = localProperties.getProperty('sharedKeystorePassword')
    keyPwd = localProperties.getProperty('sharedKeyPassword')
}

android {
    namespace 'cn.demo.xriver'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        sharedDebug {
            storeFile file("shared_debug.keystore") 
            storePassword ksPwd
            keyAlias "shared_debug_key"
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.sharedDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // AndroidX Test dependencies
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    
    // JUnit
    androidTestImplementation 'junit:junit:4.13.2'
}
